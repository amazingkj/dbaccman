ktor {
    deployment {
        port = 3080
        port = ${?PORT}
    }
    application {
        modules = [ com.dbgate.ApplicationKt.module ]
    }
}

database {
    url = "jdbc:mysql://localhost:3306/mysql"
    url = ${?DB_URL}
    user = "root"
    user = ${?DB_USER}
    password = "root123"
    password = ${?DB_PASSWORD}
    driver = "com.mysql.cj.jdbc.Driver"
    maxPoolSize = 10
}

jwt {
    secret = "dbgate-jwt-secret-key-change-in-production"
    secret = ${?JWT_SECRET}
    issuer = "dbgate"
    audience = "dbgate-users"
    realm = "DBGate"
    expirationMs = 86400000
}
