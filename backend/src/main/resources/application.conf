ktor {
    deployment {
        port = 12080
        port = ${?PORT}
    }
    application {
        modules = [ com.dbaccman.ApplicationKt.module ]
    }
}

jwt {
    secret = "dbaccman-jwt-secret-key-change-in-production"
    secret = ${?JWT_SECRET}
    issuer = "dbaccman"
    audience = "dbaccman-users"
    realm = "DBAccMan"
    expirationMs = 86400000
}
